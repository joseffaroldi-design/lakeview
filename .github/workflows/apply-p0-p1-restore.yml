name: Apply P0 P1 Restore

on:
  push:
    branches: [p0-p1-restore]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-p1-restore
      - name: Restore P0/P1 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # 1) Public page-view beacon, preserving revenue-polish code.
          replace_once(
              'frontend/src/PublicSite.jsx',
              '''const OrderButton = ({ className = "", children = "Order Online", tracking = "order_online" }) => (''',
              '''const usePageViewBeacon = (page) => {\n  useEffect(() => {\n    let sessionId = sessionStorage.getItem("visitor_session");\n    if (!sessionId) {\n      sessionId = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;\n      sessionStorage.setItem("visitor_session", sessionId);\n    }\n    axios.post(`${API}/analytics/track`, {\n      page,\n      user_agent: navigator.userAgent,\n      referrer: document.referrer || undefined,\n      session_id: sessionId,\n      screen_width: window.innerWidth,\n      screen_height: window.innerHeight,\n    }).catch(() => {});\n  }, [page]);\n};\n\nconst OrderButton = ({ className = "", children = "Order Online", tracking = "order_online" }) => (''',
              'page-view hook',
          )
          replace_once(
              'frontend/src/PublicSite.jsx',
              '''export const PublicHome = () => {\n  const [content, setContent] = useState(null);\n  const [specials, setSpecials] = useState([]);''',
              '''export const PublicHome = () => {\n  const [content, setContent] = useState(null);\n  const [specials, setSpecials] = useState([]);\n  usePageViewBeacon("/");''',
              'home beacon',
          )
          replace_once(
              'frontend/src/PublicSite.jsx',
              '''export const PublicMenu = () => {\n  const images = useSiteImages();\n  const location = useLocation();''',
              '''export const PublicMenu = () => {\n  const images = useSiteImages();\n  const location = useLocation();\n  usePageViewBeacon("/menu");''',
              'menu beacon',
          )

          # 2) Button-click retention parity with page views.
          replace_once(
              'backend/routers/analytics.py',
              '''    doc = button_click.model_dump()\n    doc['timestamp'] = doc['timestamp'].isoformat()\n    await db.button_clicks.insert_one(doc)''',
              '''    doc = button_click.model_dump()\n    doc['timestamp'] = doc['timestamp'].isoformat()\n    doc['expires_at'] = datetime.now(timezone.utc) + timedelta(days=180)\n    await db.button_clicks.insert_one(doc)''',
              'button click expiry',
          )
          replace_once(
              'backend/server.py',
              '''        await db.page_views.create_index(\n            "expires_at", name="pv_ttl", expireAfterSeconds=0\n        )\n        await db.admin_sessions.create_index(''',
              '''        await db.page_views.create_index(\n            "expires_at", name="pv_ttl", expireAfterSeconds=0\n        )\n        await db.button_clicks.create_index(\n            "expires_at", name="bc_ttl", expireAfterSeconds=0\n        )\n        await db.admin_sessions.create_index(''',
              'button click TTL index',
          )

          # 3) Home summary uses shared DB and correct catering timestamp field.
          replace_once(
              'backend/routers/home.py',
              '''import os\nfrom datetime import datetime, timezone, timedelta\nfrom typing import Any, Dict, List, Optional\n\nfrom fastapi import APIRouter, Cookie, Header, HTTPException\nfrom motor.motor_asyncio import AsyncIOMotorClient\n\nfrom auth import verify_session\n\nrouter = APIRouter(prefix="/home")\n\n_client = AsyncIOMotorClient(os.environ["MONGO_URL"])\ndb = _client[os.environ["DB_NAME"]]''',
              '''from datetime import datetime, timezone, timedelta\nfrom typing import Any, Dict, List, Optional\n\nfrom fastapi import APIRouter, Cookie, Header, HTTPException\n\nfrom auth import verify_session\nfrom config import db\n\nrouter = APIRouter(prefix="/home")''',
              'shared db',
          )
          replace_once(
              'backend/routers/home.py',
              '''new_inq = await db.catering_inquiries.count_documents({"created_at": {"$gte": week_ago}})''',
              '''new_inq = await db.catering_inquiries.count_documents({"submitted_at": {"$gte": week_ago}})''',
              'catering timestamp',
          )

          # 4) Specials tolerate numeric/null public prices without response validation failures.
          replace_once(
              'backend/routers/specials.py',
              '''router = APIRouter(prefix="/specials")\n\n\ndef _pack_to_special(pack: Dict[str, Any]) -> Dict[str, Any]:''',
              '''router = APIRouter(prefix="/specials")\n\n\ndef _public_price(value: Any) -> Optional[str]:\n    if value is None:\n        return None\n    if isinstance(value, str):\n        value = value.strip()\n        return value or None\n    if isinstance(value, (int, float)) and not isinstance(value, bool):\n        return str(value)\n    return None\n\n\ndef _pack_to_special(pack: Dict[str, Any]) -> Dict[str, Any]:''',
              'special price helper',
          )
          replace_once(
              'backend/routers/specials.py',
              '''        "price": item.get("price"),''',
              '''        "price": _public_price(item.get("price")),''',
              'special price mapping',
          )

          # 5) Restore regression coverage as a source-contract test that runs without live services.
          test = Path('backend/tests/test_analytics_beacon.py')
          if test.exists():
              raise SystemExit('test_analytics_beacon.py unexpectedly already exists')
          test.write_text('''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\n\n\ndef test_public_pages_send_page_view_beacons():\n    src = (ROOT / "frontend/src/PublicSite.jsx").read_text()\n    assert "const usePageViewBeacon = (page) =>" in src\n    assert "sessionStorage.getItem(\\\"visitor_session\\\")" in src\n    assert "axios.post(`${API}/analytics/track`" in src\n    assert "usePageViewBeacon(\\\"/\\\")" in src\n    assert "usePageViewBeacon(\\\"/menu\\\")" in src\n\n\ndef test_analytics_retention_covers_page_views_and_button_clicks():\n    router = (ROOT / "backend/routers/analytics.py").read_text()\n    server = (ROOT / "backend/server.py").read_text()\n    assert "doc['expires_at'] = datetime.now(timezone.utc) + timedelta(days=180)" in router\n    assert router.count("doc['expires_at'] = datetime.now(timezone.utc) + timedelta(days=180)") >= 2\n    assert "db.button_clicks.create_index" in server\n    assert 'name="bc_ttl"' in server\n''')
          PY
      - name: Syntax checks
        run: |
          python -m compileall -q backend
          python -m pytest -q backend/tests/test_analytics_beacon.py
      - name: Commit restored fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/PublicSite.jsx backend/routers/analytics.py backend/routers/home.py backend/routers/specials.py backend/server.py backend/tests/test_analytics_beacon.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore P0/P1 reliability fixes"
          git push origin HEAD:p0-p1-restore
