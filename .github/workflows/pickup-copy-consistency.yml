name: Pickup Copy Consistency
on:
  push:
    branches: [pickup-copy-consistency]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pickup-copy-consistency
      - name: Standardize pickup wording
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/PublicSite.jsx')
          s = p.read_text()
          replacements = [
              ('children = "Order Online"', 'children = "Order Pickup"'),
              ('>Order Online</a>', '>Order Pickup</a>'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected PublicSite text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('frontend/public/manifest.json')
          s = p.read_text()
          old = '"name": "Order Online"'
          new = '"name": "Order Pickup"'
          if old not in s:
              raise SystemExit('Expected manifest shortcut name not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('frontend/public/index.html')
          s = p.read_text()
          old = 'Order online, dine in, or book catering!'
          new = 'Order pickup, dine in, or book catering!'
          if old not in s:
              raise SystemExit('Expected OG description text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/PublicSite.jsx frontend/public/manifest.json frontend/public/index.html
          git commit -m "Standardize public pickup wording"
          git push origin HEAD:pickup-copy-consistency
