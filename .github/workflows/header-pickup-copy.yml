name: Header Pickup Copy
on:
  push:
    branches: [header-pickup-copy]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: header-pickup-copy
      - name: Update desktop header CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/PublicSite.jsx')
          s = p.read_text()
          old = '<OrderButton className="lv-order-desktop" tracking="order_online_header" />'
          new = '<OrderButton className="lv-order-desktop" tracking="order_online_header">Order Pickup</OrderButton>'
          if old not in s:
              raise SystemExit('Expected header CTA anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/PublicSite.jsx
          git commit -m "Use Order Pickup in desktop header"
          git push origin HEAD:header-pickup-copy
