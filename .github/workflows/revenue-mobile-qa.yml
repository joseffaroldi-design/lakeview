name: Revenue Mobile QA

on:
  push:
    branches: [revenue-polish-v1]
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: yarn build
      - name: Install browser QA tools
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.60.0 serve@14.2.4
          npx playwright install --with-deps chromium
      - name: Run mobile overflow and CTA checks
        working-directory: frontend
        run: |
          npx serve -s build -l 3000 > /tmp/lakeview-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const widths = [320, 360, 375, 390, 430];
            for (const width of widths) {
              const page = await browser.newPage({ viewport: { width, height: 900 } });
              await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (overflow) throw new Error(`Homepage horizontal overflow at ${width}px`);
              const heroPickup = page.getByRole('link', { name: /Order Pickup/i }).first();
              if (!(await heroPickup.isVisible())) throw new Error(`Hero pickup CTA not visible at ${width}px`);
              const href = await heroPickup.getAttribute('href');
              if (href !== 'https://lakeview-burgers-seafood.square.site') throw new Error(`Hero pickup href changed at ${width}px: ${href}`);
              const catering = page.getByRole('link', { name: /Get a Catering Quote/i }).first();
              if (!(await catering.isVisible())) throw new Error(`Catering CTA not visible at ${width}px`);
              await page.goto('http://127.0.0.1:3000/menu', { waitUntil: 'networkidle' });
              const menuOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (menuOverflow) throw new Error(`Menu horizontal overflow at ${width}px`);
              const menuPickup = page.getByRole('link', { name: /Order Pickup/i }).first();
              if (!(await menuPickup.isVisible())) throw new Error(`Menu pickup CTA not visible at ${width}px`);
              await page.close();
            }
            await browser.close();
            console.log('Mobile QA passed at 320, 360, 375, 390, and 430px.');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
