name: Apply Catering Start Patch

on:
  push:
    branches: [revenue-polish-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revenue-polish-v1
      - name: Patch catering form-start analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/PublicSite.jsx')
          s = p.read_text()
          old = 'import React, { useEffect, useMemo, useState } from "react";'
          new = 'import React, { useEffect, useMemo, useRef, useState } from "react";'
          if old not in s:
              raise SystemExit('React import anchor not found')
          s = s.replace(old, new, 1)
          old = '  catering_quote_click:    { name: "catering_quote_click", params: { location: "story_catering" } },\n  catering_inquiry_submit: { name: "generate_lead",        params: { lead_type: "catering" } },'
          new = '  catering_quote_click:    { name: "catering_quote_click", params: { location: "story_catering" } },\n  catering_form_start:     { name: "catering_form_start", params: { location: "catering_form" } },\n  catering_inquiry_submit: { name: "generate_lead",        params: { lead_type: "catering" } },'
          if old not in s:
              raise SystemExit('Catering GA anchor not found')
          s = s.replace(old, new, 1)
          old = '  const [status, setStatus] = useState("idle");\n  const [feedback, setFeedback] = useState("");'
          new = '  const [status, setStatus] = useState("idle");\n  const [feedback, setFeedback] = useState("");\n  const formStarted = useRef(false);\n  const markFormStart = () => {\n    if (formStarted.current) return;\n    formStarted.current = true;\n    track("catering_form_start");\n  };'
          if old not in s:
              raise SystemExit('Catering state anchor not found')
          s = s.replace(old, new, 1)
          old = '<form onSubmit={submit}>'
          new = '<form onSubmit={submit} onFocusCapture={markFormStart}>'
          if old not in s:
              raise SystemExit('Catering form anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/PublicSite.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Track catering form starts"
          git push origin HEAD:revenue-polish-v1
