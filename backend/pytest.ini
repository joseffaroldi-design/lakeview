[pytest]
# Sprint 22 Phase 5 — Test Repair Baseline
#
# Default test runs exclude `-m "not slow"`. Slow tests are sandbox-
# incompatible Playwright/HTML-renderer integration tests that hang in
# the dev container. They can be run explicitly with:
#     pytest -m slow
# Or run everything with:
#     pytest -m ""
addopts = -m "not slow" --tb=line --no-header
markers =
    slow: marks tests as slow / sandbox-incompatible (skip with default; opt-in with -m slow)
